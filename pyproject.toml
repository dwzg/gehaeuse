[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gehaeuse"
version = "0.1.0"
description = "3D-printed enclosures as code: measure build123d solids, gasket and print estimates, headless renders."
readme = "README.md"
license = "MIT"
authors = [{ name = "Dennis Witzig" }]
requires-python = ">=3.11"
dependencies = ["build123d>=0.13", "numpy>=2.0", "scipy>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/dwzg/gehaeuse"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E741"]   # l/I/O as names: common in geometry code (layer, index)

[tool.pytest.ini_options]
testpaths = ["tests"]
